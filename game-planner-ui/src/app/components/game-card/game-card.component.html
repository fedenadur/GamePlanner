<div class="game-card card">
  <div class="cover-wrap" [routerLink]="['/games', game.id]" style="cursor:pointer">
    <img *ngIf="game.coverImageUrl" [src]="game.coverImageUrl" [alt]="game.name" class="cover-img" loading="lazy" />
    <div *ngIf="!game.coverImageUrl" class="cover-placeholder">🎮</div>
    <div class="cover-overlay"><span class="overlay-label">View Details</span></div>
    <span class="status-chip status-{{ statusColor(game.status) }}">{{ game.status }}</span>
  </div>

  <div class="card-body">
    <div class="card-header">
      <span class="game-name" [title]="game | gameTitle">{{ game | gameTitle }}</span>
      <button class="fav-btn" [class.on]="game.isFavorite" [title]="game.isFavorite ? 'Remove favorite' : 'Add favorite'"
              (click)="favoriteToggled.emit(game)">{{ game.isFavorite ? '♥' : '♡' }}</button>
      <div class="menu-wrap" (clickOutside)="menuOpen = false">
        <button class="menu-btn" title="More" (click)="menuOpen = !menuOpen">⋯</button>
        <div class="menu" *ngIf="menuOpen">
          <button (click)="menuOpen = false; edit.emit(game)">Edit</button>
          <button class="danger" (click)="menuOpen = false; delete.emit(game)">Delete</button>
        </div>
      </div>
    </div>

    <div class="meta">
      <span class="store-label">{{ storeLabel }}</span>
      <span class="hours" [class.played]="game.totalHours > 0">{{ hoursLabel }}</span>
    </div>

    <div class="pills-row">
      <span class="pill genre-pill {{ genreMeta(g).cls }}" [title]="g" *ngFor="let g of shownGenres">{{ genreMeta(g).icon }} {{ g }}</span>
      <span class="pill tag-pill" *ngIf="extraGenres > 0">+{{ extraGenres }}</span>
    </div>
  </div>
</div>
